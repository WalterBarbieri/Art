@if (filePaths && filePaths.length > 0) {
<div class="files-section text-center mb-4">
  <h2 class="mb-5">{{ "PROJECT.DETAILS.FILES" | translate }}</h2>
  <div class="d-flex justify-content-center flex-wrap gap-3">
    @for (file of filePaths; track file; let i = $index) {
    <div
      class="card file-card"
      [class.clickable]="!isPreviewMode"
      (click)="isPreviewMode ? null : onFileClick(file)"
    >
      <div
        class="card-body d-flex flex-column align-items-center justify-content-evenly p-1"
      >
        <i [class]="getFileIconClass(file)" class="file-icon"></i>
        <h6 class="card-title">{{ getFileName(file) }}</h6>
      </div>
    </div>
    }
  </div>
</div>
}

<div class="modal-header">
  <h5 class="modal-title">{{ 'ADMIN.PROJECTS.ARCHIVE_MODAL_TITLE' | translate }}</h5>
  <button type="button" class="btn-close" (click)="activeModal.dismiss()" aria-label="Close"></button>
</div>
<div class="modal-body">
  <p class="text-black">
    {{ 'ADMIN.PROJECTS.ARCHIVE_MODAL_MESSAGE' | translate:{title: contentTitle, type: contentType} }}
  </p>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="activeModal.dismiss()">
    {{ 'MODALS.CLOSE' | translate }}
  </button>
  <button type="button" class="btn btn-warning" (click)="confirmArchive()">
    {{ 'ADMIN.PROJECTS.ARCHIVE_CONFIRM' | translate }}
  </button>
</div>

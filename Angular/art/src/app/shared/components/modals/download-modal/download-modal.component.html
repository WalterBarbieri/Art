<div class="modal-header">
  <h5 class="modal-title">{{ 'MODALS.DOWNLOAD.FILE' | translate }}</h5>
  <button type="button" class="btn-close" (click)="activeModal.dismiss()" aria-label="Close"></button>
</div>
<div class="modal-body">
  <p class="text-black">{{ 'MODALS.DOWNLOAD.CONFIRM' | translate }} <strong>{{ fileName }}?</strong></p>
</div>
<div class="modal-footer">
  <button type="button" class="btn danger-button" (click)="activeModal.dismiss()">{{ 'MODALS.CLOSE' | translate }}</button>
  <button type="button" class="btn default-button" (click)="downloadFile()">{{ 'MODALS.DOWNLOAD.DOWNLOAD' | translate }}</button>
</div>
